<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fontsource-noto-sans-jp-5.3.1/package/400.css">
<link rel="stylesheet" href="fonts/fontsource-noto-sans-jp-5.3.1/package/500.css">
<link rel="stylesheet" href="fonts/fontsource-noto-sans-jp-5.3.1/package/700.css">
<link rel="stylesheet" href="fonts/fontsource-noto-sans-jp-5.3.1/package/900.css">
<link rel="stylesheet" href="fonts/fontsource-zen-maru-gothic-5.3.1/package/700.css">
<link rel="stylesheet" href="fonts/fontsource-zen-maru-gothic-5.3.1/package/900.css">
<style>
@page { size: A4; margin: 0; }
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#B53128;--blue:#344FA9;--green:#34793C;--gold:#B76426;--ink:#2a2420;--cream:#FBF5EA}
html,body{width:210mm;height:297mm}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:210mm;height:297mm;overflow:hidden;background:var(--cream)}
.steam{position:absolute;inset:0;width:100%;height:100%}
.top{position:relative;text-align:center;padding-top:17mm}
.logo{width:56mm;height:auto;display:block;margin:0 auto}
.sub{margin-top:4mm;font-size:10.5pt;letter-spacing:.18em;font-weight:500;color:#5a4f47}
.badge{display:inline-block;margin-top:9mm;background:var(--red);color:#fff;font-family:"Zen Maru Gothic";font-weight:900;font-size:15pt;letter-spacing:.12em;padding:1.6mm 8mm 2mm;border-radius:20mm}
.save{font-family:"Zen Maru Gothic";font-weight:700;font-size:11pt;letter-spacing:.3em;color:var(--red);margin-top:3mm}
.date{margin-top:3mm;display:flex;justify-content:center;align-items:flex-end;gap:3mm;font-family:"Zen Maru Gothic";font-weight:900;line-height:1}
.date .y{font-size:22pt;color:var(--ink);writing-mode:vertical-rl;letter-spacing:.05em;margin-bottom:3mm}
.date .md{font-size:92pt;color:var(--ink);letter-spacing:-.01em}
.date .md .dot{color:var(--red)}
.date .dw{display:flex;flex-direction:column;align-items:flex-start;gap:2mm;margin-bottom:4mm}
.date .wd{font-size:20pt;background:var(--ink);color:var(--cream);border-radius:50%;width:13mm;height:13mm;display:flex;align-items:center;justify-content:center}
.date .tm{font-size:19pt}
.venue{margin-top:6mm;font-size:12.5pt;font-weight:700}
.venue small{display:block;font-size:9.5pt;font-weight:400;color:#5a4f47;margin-top:1mm;letter-spacing:.05em}
.venue .k{display:inline-block;border:1.2px solid var(--ink);font-size:9pt;padding:0 2mm;margin-right:2.5mm;vertical-align:2px;border-radius:1mm}
.purpose{margin:9mm auto 0;font-family:"Zen Maru Gothic";font-weight:700;font-size:13pt;letter-spacing:.06em;color:var(--ink)}
.purpose b{color:var(--red)}
.purpose-en{font-size:8pt;letter-spacing:.35em;color:#8a7d72;margin-top:1.5mm;font-weight:500}
.qrs{position:absolute;left:16mm;right:16mm;bottom:26mm;background:#fff;border-radius:5mm;padding:7mm 8mm 6mm;display:flex;justify-content:space-around;box-shadow:0 0.6mm 0 rgba(0,0,0,.06)}
.qr{text-align:center;width:72mm}
.qr .h{font-family:"Zen Maru Gothic";font-weight:900;font-size:12.5pt;margin-bottom:3mm}
.qr .h .n{display:inline-block;width:6.4mm;height:6.4mm;line-height:6.4mm;border-radius:50%;color:#fff;font-size:9.5pt;margin-right:1.8mm;vertical-align:1px}
.qr img{width:40mm;height:40mm;display:block;margin:0 auto;image-rendering:pixelated}
.qr .d{font-size:8.6pt;color:#5a4f47;margin-top:2.5mm;line-height:1.55}
.qr .u{font-weight:700;color:var(--ink);font-size:9.5pt;letter-spacing:.02em}
.vline{width:0;border-left:1.2px dashed #d8cfc4;margin:2mm 0}
.note{position:absolute;left:0;right:0;bottom:13.5mm;text-align:center;font-size:9pt;color:#5a4f47;letter-spacing:.04em}
.band{position:absolute;left:0;right:0;bottom:0;height:8mm;display:flex}
.band i{flex:1}
</style></head><body><div class="page">
<svg class="steam" viewBox="0 0 210 297" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke-linecap="round" stroke-width="2.2" opacity=".13">
    <path d="M14 120 C 4 100, 26 88, 14 66 S 20 34, 12 18" stroke="#34793C"/>
    <path d="M24 128 C 16 108, 36 96, 26 74 S 32 44, 26 26" stroke="#344FA9"/>
    <path d="M196 120 C 206 100, 184 88, 196 66 S 190 34, 198 18" stroke="#B76426"/>
    <path d="M186 128 C 194 108, 174 96, 184 74 S 178 44, 184 26" stroke="#34793C"/>
  </g>
</svg>
<div class="top">
  <img class="logo" src="assets/logo_v.svg" alt="CLS べっぷ BEPPU">
  <div class="sub">コミュニティ・リーダーズ・サミット in 別府</div>
  <div class="badge">第2回 開催決定！</div>
  <div class="save">SAVE THE DATE</div>
  <div class="date">
    <span class="y">2027</span>
    <span class="md">1<span class="dot">.</span>23</span>
    <span class="dw"><span class="wd">土</span><span class="tm">13:00〜</span></span>
  </div>
  <div class="venue"><span class="k">会場</span>レンガホール<small>旧別府郵便電話局電話分室（大分県別府市）</small></div>
  <div class="purpose">挑戦者の<b>熱</b>を、別府の「源泉」から全国へ。</div>
  <div class="purpose-en">COMMUNITY LEADERS SUMMIT in BEPPU</div>
</div>
<div class="qrs">
  <div class="qr">
    <div class="h"><span class="n" style="background:var(--blue)">1</span>公式サイト</div>
    <img src="../business-card/assets/qr_site.png" alt="">
    <div class="d"><span class="u">www.cls-beppu.com</span><br>イベント詳細を随時更新中</div>
  </div>
  <div class="vline"></div>
  <div class="qr">
    <div class="h"><span class="n" style="background:var(--green)">2</span>LINEオープンチャット</div>
    <img src="../business-card/assets/qr_line.jpg" alt="">
    <div class="d"><span class="u">「CLS別府」</span><br>最新情報をいち早くお届けします</div>
  </div>
</div>
<div class="note">詳細は現在企画中です。最新情報は公式サイト・LINEオープンチャットでお知らせします。</div>
<div class="band"><i style="background:var(--green)"></i><i style="background:var(--blue)"></i><i style="background:var(--gold)"></i><i style="background:var(--red);flex:3"></i></div>
</div></body></html>
